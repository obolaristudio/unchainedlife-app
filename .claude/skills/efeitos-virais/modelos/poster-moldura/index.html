<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"/><meta name="viewport" content="width=1080, height=1920"/>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<style>
@font-face{font-family:"Bric";src:url("assets/fonts/Bricolage-800.ttf");font-weight:800}
@font-face{font-family:"Bric";src:url("assets/fonts/Bricolage-700.ttf");font-weight:700}
:root{--lime:#CBEF4B;--red:#E53935;--cream:#F2EFE6}
*{margin:0;padding:0;box-sizing:border-box}html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#root{position:relative;width:1080px;height:1920px;font-family:"Bric",sans-serif;color:#fff;overflow:hidden}
#bg{position:absolute;left:0;top:0;width:1080px;height:1920px;object-fit:cover}
#shade{position:absolute;inset:0;background:linear-gradient(#000 0%,rgba(0,0,0,.65) 22%,rgba(0,0,0,0) 34%,rgba(0,0,0,0) 66%,rgba(0,0,0,.85) 78%,#000 100%)}
#glow{position:absolute;left:140px;right:140px;top:180px;height:300px;border-radius:50%;background:radial-gradient(rgba(203,239,75,.22),rgba(0,0,0,0) 70%);filter:blur(20px)}
#tag{position:absolute;top:150px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:22px;font-weight:700;font-size:30px;letter-spacing:12px}
#tag .dot{width:22px;height:22px;border-radius:50%;background:var(--lime);box-shadow:0 0 16px var(--lime)}
#tag .sep{width:2px;height:34px;background:rgba(255,255,255,.45)}#tag .cat{color:var(--lime)}
#title{position:absolute;top:240px;left:0;right:0;text-align:center;font-weight:800;font-size:178px;letter-spacing:-6px;line-height:1;
 background:linear-gradient(90deg,#F2EFE6 0%,#CBEF4B 55%,#9BE15D 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 30px rgba(203,239,75,.35))}
#sub{position:absolute;top:440px;left:80px;right:80px;text-align:center;font-weight:800;font-size:72px;line-height:1.05;letter-spacing:-1.5px}
#sub span{color:var(--lime)}
#kick{position:absolute;top:1430px;left:0;right:0;text-align:center;font-weight:700;font-size:28px;letter-spacing:9px;color:var(--lime)}
#ben{position:absolute;top:1488px;left:90px;right:90px;text-align:center;font-weight:800;font-size:56px;line-height:1.1;letter-spacing:-.5px}
#ben span{color:var(--red)}
#cta{position:absolute;top:1660px;left:0;right:0;text-align:center}
#cta span{display:inline-block;background:var(--lime);color:#141414;font-weight:800;font-size:40px;padding:12px 32px;border-radius:40px}
#how{position:absolute;top:1748px;left:0;right:0;text-align:center;font-weight:700;font-size:30px;color:rgba(255,255,255,.75)}
#foot{position:absolute;top:1800px;left:0;right:0;text-align:center;font-weight:700;font-size:19px;letter-spacing:2px;color:rgba(255,255,255,.5)}
#frame{position:absolute;inset:26px;border:3px solid rgba(203,239,75,.55);border-radius:34px;box-shadow:inset 0 0 40px rgba(203,239,75,.12)}
</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-duration="14" data-width="1080" data-height="1920">
<video id="bg" class="clip" data-start="0" data-duration="14" src="assets/anim.mp4" muted></video>
<div id="shade" class="clip" data-start="0" data-duration="14"></div>
<div id="glow" class="clip" data-start="0" data-duration="14"></div>
<div id="frame" class="clip" data-start="0" data-duration="14"></div>
<div id="tag" class="clip" data-start="0" data-duration="14"><span class="dot"></span>OBOLARI ACADEMY<span class="sep"></span><span class="cat">LONGEVIDADE</span></div>
<div id="title" class="clip" data-start="0" data-duration="14">EPITALON</div>
<div id="sub" class="clip" data-start="0" data-duration="14">pode alongar seus <span>telômeros?</span></div>
<div id="kick" class="clip" data-start="0" data-duration="14">AS TAMPAS DE PROTEÇÃO DO SEU DNA</div>
<div id="ben" class="clip" data-start="0" data-duration="14">Elas encurtam com a idade.<br>Em laboratório, <span>ele as alongou.</span></div>
<div id="cta" class="clip" data-start="0" data-duration="14"><span>Comenta GUIA 📩</span></div>
<div id="how" class="clip" data-start="0" data-duration="14">Entenda na legenda 👇</div>
<div id="foot" class="clip" data-start="0" data-duration="14">@OBOLARI_ACADEMY · CONTEÚDO EDUCATIVO · NÃO É RECOMENDAÇÃO MÉDICA</div>
</div>
<script>
const tl=gsap.timeline({paused:true});
tl.fromTo("#title",{opacity:0,scale:1.08},{opacity:1,scale:1,duration:0.6,ease:"power3.out"},0.05);
tl.fromTo("#tag,#sub",{opacity:0,y:20},{opacity:1,y:0,duration:0.5,stagger:0.12,ease:"power3.out"},0.35);
tl.fromTo("#frame",{opacity:0},{opacity:1,duration:0.8},0.2);
tl.fromTo("#kick,#ben",{opacity:0,y:20},{opacity:1,y:0,duration:0.5,stagger:0.12},0.8);
tl.fromTo("#cta,#how,#foot",{opacity:0},{opacity:1,duration:0.5,stagger:0.08},1.3);
tl.to("#glow",{opacity:0.5,duration:1.5,yoyo:true,repeat:3,ease:"sine.inOut"},1.5);
tl.to("#cta span",{scale:1.06,duration:0.5,yoyo:true,repeat:5,ease:"sine.inOut"},6);
tl.to("#title,#sub,#kick,#ben,#cta,#how",{opacity:0,duration:0.35},13.55);
window.__timelines["main"]=tl;tl.seek(0);
</script></body></html>
